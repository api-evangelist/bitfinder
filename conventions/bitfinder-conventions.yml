pagination:
  style: time-window
  params:
    - from
    - to
    - limit
    - desc
  notes: >-
    Air-data endpoints are paginated by a bounded time window (from/to) plus a
    limit and sort direction (desc, default true). Raw returns up to 360 records
    per request over a maximum 1-hour window; 5-min-avg spans up to 24 hours;
    15-min-avg spans up to 7 days.
  response_field: data
idempotency:
  supported: false
  notes: >-
    The public developer API is read-only (GET only) — user profile, device
    list, and air-data reads — so there is no write-idempotency contract. No
    Idempotency-Key header is documented.
rate_limiting:
