aid: bitfinder
name: Bitfinder
description: >-
  Bitfinder, Inc., doing business as Awair, builds indoor air quality (IAQ)
  monitors and a cloud platform used across homes, offices, schools, and
  commercial spaces. Its devices (Awair Element, Awair Omni, and 2nd Edition)
  measure the Awair Score along with temperature, humidity, CO2, chemicals
  (VOC), and fine dust (PM2.5). The Awair Home & OAuth Developer API lets
  developers, partners, and hobbyists read a user's registered devices and their
  air-data time series (latest, raw per-second, 5-minute-average, and
  15-minute-average) on behalf of Awair users, authorized with an OAuth 2.0 or
  Developer Console Bearer token. Bitfinder was a Techstars portfolio company.
